name: tronosa-reliability

services:
  web:
    build:
      context: ../../..
      dockerfile: tests/reliability/infrastructure/Dockerfile
      target: web
    init: true
    restart: "on-failure:3"
    sysctls:
      net.ipv4.tcp_max_syn_backlog: "4096"
    networks:
      - reliability
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:1.28-alpine
    init: true
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - reliability

  k6:
    build:
      context: ../../..
      dockerfile: tests/reliability/infrastructure/Dockerfile
      target: reliability
    environment:
      BASE_URL: http://nginx:8080
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - reliability

networks:
  reliability:
    driver: bridge
